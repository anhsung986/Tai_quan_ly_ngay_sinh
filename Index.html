<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải App Quản lý ngày sinh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 50px 20px;
            color: #333;
        }
        .container {
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        h1 {
            color: #007bff;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 14px 25px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0px 4px 6px rgba(40, 167, 69, 0.3);
            transition: background 0.2s;
        }
        .btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quản lý ngày sinh</h1>
        <p>Ứng dụng quản lý ngày sinh cá nhân tiện lợi trên Android.</p>
        
        <!-- Nút tải file APK trực tiếp -->
        <a href="Quanlyngaysinh.apk" class="btn" download>📥 Tải xuống APK</a>
    </div>
</body>
</html>
